# Deploys Quilt's accounts API to Fly (the quilt-api app in fly.api.toml; see docs/hosting.md).
# Runs on pushes to main that change what the API runs, and by hand from the Actions tab.
# Needs the FLY_API_TOKEN repository secret with access to quilt-api.
name: API deploy
on:
  push:
    branches: [main]
    paths: ['src/**', 'bin/**', 'Dockerfile', 'fly.api.toml', 'package*.json', '.github/workflows/api-deploy.yml']
  workflow_dispatch:
concurrency:
  group: api-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config fly.api.toml --remote-only --ha=false --app quilt-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
