name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fastest first, so a broken change fails in seconds; together these are `npm test`.
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
