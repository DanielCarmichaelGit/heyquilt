# Builds Quilt for every platform on GitHub's own machines and publishes the GitHub release,
# when a version tag (v1.2.3) is pushed. `npm run release` checks everything and pushes the
# tag, so any machine can release, a cloud one included: nothing is built on it.
#
#   macOS    quilt-mac-arm64.dmg, quilt-mac-x64.dmg
#   Windows  quilt-windows-x64.exe
#   Linux    quilt-linux-x86_64.AppImage, quilt-linux-arm64.AppImage (desktops)
#            quilt-cli-linux-x64.tar.gz, quilt-cli-linux-arm64.tar.gz, install.sh (servers and cloud machines)
name: Release

on:
  push:
    tags: ['v*.*.*']
  # Run by hand (Actions → Release → Run workflow): builds every platform and publishes
  # nothing, to check the builds without making a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json, and RELEASES.md has its notes
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi
          node scripts/release.mjs --notes > notes.md
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3 # only needed until the release is published
          name: notes
          path: notes.md

  mac:
    needs: check
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (ad-hoc), as before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3 # only needed until the release is published
          name: mac
          path: dist/quilt-mac-*.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3 # only needed until the release is published
          name: windows
          path: dist/quilt-windows-*.exe
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --linux --publish never
      - name: The command line for servers and cloud machines
        run: node scripts/cli-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3 # only needed until the release is published
          name: linux
          path: |
            dist/quilt-linux-*.AppImage
            dist/quilt-cli-linux-*.tar.gz
            dist/install.sh
          if-no-files-found: error

  publish:
    needs: [mac, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Quilt ${GITHUB_REF_NAME#v}" --notes-file out/notes.md --latest \
            out/quilt-mac-arm64.dmg out/quilt-mac-x64.dmg out/quilt-windows-x64.exe \
            out/quilt-linux-x86_64.AppImage out/quilt-linux-arm64.AppImage \
            out/quilt-cli-linux-x64.tar.gz out/quilt-cli-linux-arm64.tar.gz out/install.sh
